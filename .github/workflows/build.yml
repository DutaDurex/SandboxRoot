name: Build SandboxRoot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "=== Download Android commandline-tools ==="
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          mv latest cmdline-tools/
          echo "=== Setup sdkmanager ==="
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Licenses & Install SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "platform-tools" > /dev/null 2>&1 || true
          echo "=== Verify install ==="
          ls $HOME/android-sdk/platforms/
          ls $HOME/android-sdk/build-tools/
          ls $HOME/android-sdk/ndk/ 2>/dev/null || true

      - name: Download Gradle 7.4.2
        run: |
          cd /tmp
          wget -q "https://services.gradle.org/distributions/gradle-7.4.2-bin.zip" -O gradle.zip
          unzip -q gradle.zip
          echo "/tmp/gradle-7.4.2/bin" >> $GITHUB_PATH

      - name: Verify Setup
        run: |
          gradle --version
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_HOME"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: SandboxRoot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
