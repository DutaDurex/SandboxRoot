name: Build SandboxRoot APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/NOTICE.txt cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Licenses & Install SDK
        run: |
          SDKMGR=$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMGR --sdk_root=$HOME/android-sdk --licenses > /dev/null 2>&1 || true
          yes | $SDKMGR --sdk_root=$HOME/android-sdk "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          ls $HOME/android-sdk/platforms/
          ls $HOME/android-sdk/build-tools/

      - name: Download Gradle 7.6
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "/tmp/gradle-7.6/bin" >> $GITHUB_PATH

      - name: Verify Setup
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SandboxRoot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
